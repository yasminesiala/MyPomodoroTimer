    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #f7e7ce; /* Warmer, more visible cream */
        }
        .miffy-orange { background-color: #ff5f00; }
        .miffy-blue { background-color: #00509d; }
        .miffy-yellow { background-color: #ffdf00; }
        .miffy-green { background-color: #009b4d; }
        .text-miffy-orange { color: #ff5f00; }
        
        /* Removed floating animation for a still Miffy */

        /* Fix button 'tweak' feel by making interaction more obvious */
        .miffy-btn {
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .miffy-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,1) !important;
        }
    </style>
